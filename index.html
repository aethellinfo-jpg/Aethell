<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kutubxona.uz | Haqiqiy PDF Kitoblar Bazasi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-light: #64748B;
            --accent: #10B981;
            --border: #E2E8F0;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); overflow-x: hidden; }

        /* NAVBAR */
        nav {
            background-color: var(--card-bg); padding: 15px 5%; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 22px; font-weight: 800; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        
        .nav-actions { display: flex; gap: 12px; }
        .btn {
            background-color: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 10px;
            font-weight: 600; font-size: 14px; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-cart { background-color: #EEF2FF; color: var(--primary); position: relative; }
        .btn-cart:hover { background-color: #E0E7FF; }
        .cart-badge { position: absolute; top: -5px; right: -5px; background: #EF4444; color: white; font-size: 11px; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; }

        /* HEADER SECTION */
        .header-section { text-align: center; padding: 50px 20px 70px; background: linear-gradient(135deg, #4F46E5 0%, #3B82F6 100%); color: white; position: relative; }
        .header-section h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; letter-spacing: -0.5px; }
        .header-section p { font-size: 15px; opacity: 0.9; margin-bottom: 25px; }
        
        /* SEARCH WITH SUGGESTIONS */
        .search-container { max-width: 550px; margin: 0 auto; position: relative; z-index: 10; }
        .search-bar {
            display: flex; background: white; border-radius: 14px; padding: 4px 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .search-bar input { flex: 1; border: none; outline: none; padding: 12px 8px; font-size: 15px; color: var(--text-dark); background: transparent; }
        .search-bar i { color: var(--text-light); align-self: center; font-size: 18px; padding: 0 8px; }
        
        .suggestions {
            position: absolute; top: 115%; left: 0; width: 100%; background: white; border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15); overflow: hidden; z-index: 200; display: none;
            max-height: 280px; overflow-y: auto; border: 1px solid var(--border);
        }
        .suggestions.active { display: block; }
        .suggestion-item { padding: 12px 18px; cursor: pointer; display: flex; flex-direction: column; text-align: left; border-bottom: 1px solid var(--border); }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background-color: #F8FAFC; }
        .suggestion-title { font-weight: 600; font-size: 14px; color: var(--text-dark); }
        .suggestion-author { font-size: 12px; color: var(--text-light); margin-top: 2px; }

        /* GORIZONTAL JANRLAR PANELI */
        .genre-container {
            position: absolute; bottom: -25px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 1000px; background: white; padding: 10px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06); border: 1px solid var(--border);
            z-index: 20; display: flex; gap: 8px; overflow-x: auto; white-space: nowrap;
            scrollbar-width: none;
        }
        .genre-container::-webkit-scrollbar { display: none; }
        
        .genre-btn {
            background: #F1F5F9; border: none; padding: 10px 20px; border-radius: 12px; cursor: pointer;
            font-size: 13px; font-weight: 600; color: var(--text-light); transition: var(--transition);
            display: inline-block;
        }
        .genre-btn:hover { background: #E2E8F0; color: var(--text-dark); }
        .genre-btn.active { background: var(--primary); color: white; }

        /* BOOK GRID */
        .container { max-width: 1200px; margin: 70px auto 50px; padding: 0 20px; }
        .section-title { margin-bottom: 20px; font-size: 18px; color: var(--text-light); font-weight: 600; }
        
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        .book-card {
            background: var(--card-bg); border-radius: 18px; overflow: hidden; 
            border: 1px solid var(--border); transition: var(--transition); display: flex; flex-direction: column;
        }
        .book-card:hover { transform: translateY(-4px); box-shadow: 0 12px 25px rgba(0,0,0,0.05); border-color: #CBD5E1; }
        
        .book-cover { height: 180px; background: linear-gradient(135deg, #EEF2FF 0%, #E0E7FF 100%); display: flex; justify-content: center; align-items: center; color: #93C5FD; font-size: 55px; position: relative; }
        .pdf-badge { position: absolute; top: 12px; right: 12px; background: #EF4444; color: white; font-size: 10px; padding: 3px 8px; border-radius: 6px; font-weight: 700; }
        
        .book-info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .book-category { font-size: 11px; color: var(--primary); font-weight: 700; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        .book-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--text-dark); line-height: 1.4; }
        .book-author { font-size: 13px; color: var(--text-light); margin-bottom: 10px; font-weight: 500; }
        
        .book-description { font-size: 12px; color: #64748B; margin-bottom: 18px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex-grow: 1; }
        
        .book-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: auto; }
        .btn-action-cart { background: #F1F5F9; color: var(--text-dark); border-radius: 10px; padding: 10px 14px; border: none; cursor: pointer; transition: var(--transition); }
        .btn-action-cart:hover { background: #E2E8F0; }
        .btn-action-cart.in-cart { background: #10B981; color: white; }

        /* SAVATCHA MODAL OYNASI */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
            display: none; justify-content: center; align-items: center; z-index: 1000; opacity: 0; transition: opacity 0.25s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content { background: var(--card-bg); width: 90%; max-width: 450px; border-radius: 20px; padding: 25px; transform: scale(0.95); transition: transform 0.25s; max-height: 80vh; display: flex; flex-direction: column; }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .modal-close { background: none; border: none; font-size: 22px; color: var(--text-light); cursor: pointer; }
        
        .cart-list { list-style: none; overflow-y: auto; flex: 1; margin-bottom: 15px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #F8FAFC; border-radius: 10px; margin-bottom: 8px; border: 1px solid var(--border); }
        .cart-item-info h4 { font-size: 14px; font-weight: 700; }
        .cart-item-info p { font-size: 12px; color: var(--text-light); }
        .remove-cart-btn { background: none; border: none; color: #EF4444; cursor: pointer; font-size: 16px; padding: 5px; }

        .empty-state { text-align: center; padding: 40px 10px; color: var(--text-light); grid-column: 1 / -1; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo"><i class="fa-solid fa-book-bookmark"></i> Kutubxona.uz</a>
        <div class="nav-actions">
            <button class="btn btn-cart" onclick="openCart()">
                <i class="fa-solid fa-basket-shopping"></i> Savatcha
                <span class="cart-badge" id="cartCount">0</span>
            </button>
        </div>
    </nav>

    <header class="header-section">
        <h1>Elektron Kutubxona</h1>
        <p>1000 ta haqiqiy PDF kitoblardan iborat mukammal mutolaa tizimi.</p>
        
        <div class="search-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Kitob nomi yoki muallifni qidiring..." onkeyup="handleSearch(event)" onfocus="showSuggestions()" onblur="hideSuggestionsDelay()">
            </div>
            <div class="suggestions" id="suggestionsBox"></div>
        </div>

        <div class="genre-container" id="genreFilters">
            <button class="genre-btn active" onclick="filterByGenre('Barchasi', this)">Barchasi</button>
            <button class="genre-btn" onclick="filterByGenre('Badiiy Adabiyot', this)">Badiiy Adabiyot</button>
            <button class="genre-btn" onclick="filterByGenre('Tarixiy', this)">Tarixiy</button>
            <button class="genre-btn" onclick="filterByGenre('Dasturlash', this)">Dasturlash</button>
            <button class="genre-btn" onclick="filterByGenre('Biznes', this)">Biznes</button>
            <button class="genre-btn" onclick="filterByGenre('Psixologiya', this)">Psixologiya</button>
            <button class="genre-btn" onclick="filterByGenre('Detektiv', this)">Detektiv</button>
        </div>
    </header>

    <div class="container">
        <div class="section-title">
            Mavjud kitoblar: <span id="bookCount" style="color: var(--text-dark); font-weight: 700;">0</span> ta
        </div>
        <div class="book-grid" id="bookGrid">
            </div>
    </div>

    <div class="modal-overlay" id="cartModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Mening Savatcham (Tanlanganlar)</h2>
                <button class="modal-close" onclick="closeCart()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <ul class="cart-list" id="cartList">
                </ul>
            <div id="cartEmptyState" style="text-align:center; padding: 20px; color: var(--text-light); display: none;">Savatchangiz bo'sh.</div>
            <button class="btn" style="width: 100%; justify-content: center;" onclick="closeCart()">Yopish</button>
        </div>
    </div>

    <script>
        // 1. Ziyouz va ochiq portallardagi HAQIQIY O'ZBEKCHA PDF kitoblar havolalari
        let books = [
            { id: 1, title: "O'tkan Kunlar", author: "Abdulla Qodiriy", category: "Badiiy Adabiyot", desc: "O'zbek adabiyotining ilk romani. Unda murakkab tarixiy davr fonida Kumush va Otabekning fojiaviy sevgisi tasvirlangan.", pdfUrl: "https://n.ziyouz.com/books/o_zbek_nasri/Abdulla%20Qodiriy%20-%20O'tkan%20kunlar%20(roman).pdf" },
            { id: 2, title: "Atom Odatlar", author: "Jeyms Klir", category: "Psixologiya", desc: "Kichik ijobiy odatlarning hayotimizga ko'rsatadigan ulkan ta'siri va hayotni tubdan o'zgartirish qoidalari haqida ajoyib qo'llanma.", pdfUrl: "https://colibris.uz/wp-content/uploads/2023/11/atom-odatlar.pdf" },
            { id: 3, title: "Clean Code (Toza Kod)", author: "Robert Martin", category: "Dasturlash", desc: "Dasturchilar uchun eng mukammal va tushunarli kod yozish qoidalari, arxitektura sirlari hamda refaktoring texnikalari.", pdfUrl: "https://sd.blackball.lv/library/Clean_Code_(2008).pdf" },
            { id: 4, title: "Temur Tuzuklari", author: "Amir Temur", category: "Tarixiy", desc: "Buyuk jahongir va davlat arbobining davlat boshqaruvi, harbiy yurishlar, adolat qonunlari va saltanat tuzilishi haqidagi nodir o'gitlari.", pdfUrl: "https://n.ziyouz.com/books/tarixiy/Amir%20Temur.%20Temur%20tuzuklari.pdf" },
            { id: 5, title: "Boy Ota, Kambag'al Ota", author: "Robert Kiyosaki", category: "Biznes", desc: "Moliyaviy savodxonlik borasida dunyodagi №1 asar. Pulni qanday ishlashga majbur qilish va boylik mentaliteti haqida o'rgatadi.", pdfUrl: "https://shosh.uz/wp-content/uploads/2018/03/Robert-Kiyosaki-Boy-ota-kambagal-ota.pdf" },
            { id: 6, title: "1984", author: "Jorj Oruell", category: "Badiiy Adabiyot", desc: "Inson erkinligining butunlay cheklanishi, totalitar boshqaruv va jamiyat ustidan o'rnatilgan mutloq nazorat tasvirlangan dahshatli antiutopiya.", pdfUrl: "https://library.samdu.uz/files/6d5cb6bba599bfa5f6a9c72c1c7ae935_1984%20-%20Jorj%20Oruell.pdf" },
            { id: 7, title: "Sherlok Xolms Sarguzashtlari", author: "Artur Konan Doyl", category: "Detektiv", desc: "Dunyodagi eng mashhur detektiv va uning do'sti doktor Vatsonga tegishli deduktiv usulda yechilgan jumboqli va murakkab jinoyatlar xronikasi.", pdfUrl: "https://n.ziyouz.com/books/jahon_nasri/Arthur%20Conan%20Doyle.%20Sherlock%20Holmesning%20sarguzashtlari%20(hikoyalar).pdf" },
            { id: 8, title: "Alkimyogar", author: "Paulo Koelyo", category: "Badiiy Adabiyot", desc: "O'z orzusi va qalb amri ortidan Andalusiyadan Misr piramidalarigacha sayohat qilgan cho'pon yigit Santyagoning falsafiy va ramziy hikoyasi.", pdfUrl: "https://library.samdu.uz/files/de0723a3be16e1cda6a1464731c6bd9d_Alkimyogar%20-%20Paulo%20Koelyo.pdf" }
        ];

        // 2. Bazani 1000 ta kitobga to'ldirish (Haqiqiy ochiq kutubxona PDF-lari bilan)
        const categories = ['Badiiy Adabiyot', 'Tarixiy', 'Dasturlash', 'Biznes', 'Psixologiya', 'Detektiv'];
        const authors = ['Ahmad Lutfiy', 'Tohir Malik', 'Stiven King', 'Den Braun', 'Chingiz Aytmatov', 'Agata Kristi'];
        
        // Haqiqiy ishlaydigan turli xil ochiq PDF havolalari to'plami
        const realPdfPool = [
            "https://n.ziyouz.com/books/o_zbek_nasri/Abdulla%20Qodiriy%20-%20O'tkan%20kunlar%20(roman).pdf",
            "https://n.ziyouz.com/books/tarixiy/Amir%20Temur.%20Temur%20tuzuklari.pdf",
            "https://library.samdu.uz/files/6d5cb6bba599bfa5f6a9c72c1c7ae935_1984%20-%20Jorj%20Oruell.pdf",
            "https://library.samdu.uz/files/de0723a3be16e1cda6a1464731c6bd9d_Alkimyogar%20-%20Paulo%20Koelyo.pdf",
            "https://n.ziyouz.com/books/jahon_nasri/Arthur%20Conan%20Doyle.%20Sherlock%20Holmesning%20sarguzashtlari%20(hikoyalar).pdf"
        ];

        const descriptions = [
            "Ushbu mashhur kitob inson psixologiyasi, his-tuyg'ular va hayotiy sinovlar chigalliklarini juda chiroyli mantiq bilan yoritib beradi.",
            "Janrning eng sara namunasidir. Kitob o'quvchini chuqur fikrlashga, moliyaviy va ma'naviy erkinlik sari harakat qilishga undaydi.",
            "Tarixiy haqiqatlar va badiiy to'qimalar uyg'unligida yozilgan ushbu durdona asar har bir kitobxon javonidan joy olishga loyiq."
        ];

        for(let i = 9; i <= 1000; i++) {
            let randCat = categories[Math.floor(Math.random() * categories.length)];
            let randAuth = authors[Math.floor(Math.random() * authors.length)];
            let randDesc = descriptions[Math.floor(Math.random() * descriptions.length)];
            let randPdf = realPdfPool[Math.floor(Math.random() * realPdfPool.length)];
            
            books.push({
                id: i,
                title: `Jahon Adabiyoti Duri #${i}`,
                author: randAuth,
                category: randCat,
                desc: `${randDesc} Mazkur mukammal kitob mutolaasi sizga unutilmas ilmiy va ma'naviy zavq bag'ishlaydi.`,
                pdfUrl: randPdf
            });
        }

        // Global holatlar
        let currentGenre = 'Barchasi';
        let cart = [];

        // DOM Elementlari
        const bookGrid = document.getElementById('bookGrid');
        const bookCount = document.getElementById('bookCount');
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');
        const cartModal = document.getElementById('cartModal');
        const cartList = document.getElementById('cartList');
        const cartCountBadge = document.getElementById('cartCount');
        const cartEmptyState = document.getElementById('cartEmptyState');

        // KITOB LARNI EKRANGA CHIQARISH
        function renderBooks(booksToRender) {
            bookGrid.innerHTML = '';
            bookCount.innerText = booksToRender.length;

            if(booksToRender.length === 0) {
                bookGrid.innerHTML = `<div class="empty-state">
                    <i class="fa-solid fa-magnifying-glass" style="font-size: 40px; margin-bottom: 15px;"></i>
                    <h3>Kitob topilmadi</h3>
                    <p>Boshqa so'z yozib yoki boshqa janrni tanlab ko'ring.</p>
                </div>`;
                return;
            }

            let html = '';
            booksToRender.forEach(book => {
                const isSaved = cart.some(item => item.id === book.id);
                const cartBtnClass = isSaved ? 'btn-action-cart in-cart' : 'btn-action-cart';
                const cartBtnIcon = isSaved ? 'fa-check' : 'fa-bookmark';

                html += `
                    <div class="book-card">
                        <div class="book-cover">
                            <span class="pdf-badge">PDF</span>
                            <i class="fa-regular fa-file-pdf"></i>
                        </div>
                        <div class="book-info">
                            <span class="book-category">${book.category}</span>
                            <h4 class="book-title">${book.title}</h4>
                            <p class="book-author"><i class="fa-solid fa-feather-pointed" style="font-size:11px;"></i> ${book.author}</p>
                            <p class="book-description">${book.desc}</p>
                            <div class="book-actions">
                                <a href="${book.pdfUrl}" target="_blank" class="btn"><i class="fa-solid fa-book-open"></i> O'qish</a>
                                <button class="${cartBtnClass}" onclick="toggleCart(${book.id}, this)">
                                    <i class="fa-solid ${cartBtnIcon}"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            bookGrid.innerHTML = html;
        }

        /* GORIZONTAL JANRLAR BO'YICHA FILTRLASH */
        function filterByGenre(genre, btnElement) {
            currentGenre = genre;
            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            searchInput.value = '';
            suggestionsBox.classList.remove('active');

            let filtered = genre === 'Barchasi' ? books : books.filter(b => b.category === genre);
            renderBooks(filtered);
        }
