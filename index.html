<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Kutubxona | Smart Library (1000 Books)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #0F172A;
            --text-light: #64748B;
            --danger: #EF4444;
            --border: #E2E8F0;
            --transition: all 0.2s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); }

        /* NAVBAR */
        nav {
            background-color: var(--card-bg); padding: 15px 5%; display: flex; justify-content: space-between;
            align-items: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100;
        }
        .logo { font-size: 24px; font-weight: 700; color: var(--primary); text-decoration: none; display: flex; align-items: center; gap: 10px; }
        
        .btn {
            background-color: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 8px;
            font-weight: 500; cursor: pointer; transition: var(--transition); display: flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
        .btn-outline { background-color: transparent; border: 1px solid var(--border); color: var(--text-dark); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); transform: none; }

        /* HEADER & SEARCH WITH AUTOCOMPLETE */
        .header-section { text-align: center; padding: 60px 20px; background: linear-gradient(135deg, #1E293B 0%, #0F172A 100%); color: white; }
        .header-section h1 { font-size: 40px; margin-bottom: 15px; font-weight: 800;}
        
        .search-container { max-width: 600px; margin: 0 auto; position: relative; text-align: left; }
        .search-bar {
            display: flex; background: white; border-radius: 12px; padding: 5px 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 2px solid transparent; transition: var(--transition);
        }
        .search-bar:focus-within { border-color: var(--primary); }
        .search-bar input { flex: 1; border: none; outline: none; padding: 15px 10px; font-size: 16px; border-radius: 12px; color: var(--text-dark); }
        .search-bar i { color: var(--text-light); align-self: center; font-size: 20px; padding: 0 10px; }
        
        .suggestions {
            position: absolute; top: 110%; left: 0; width: 100%; background: white; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; z-index: 200; display: none;
            max-height: 300px; overflow-y: auto;
        }
        .suggestions.active { display: block; }
        .suggestion-item { padding: 15px 20px; cursor: pointer; display: flex; flex-direction: column; border-bottom: 1px solid var(--border); color: var(--text-dark); }
        .suggestion-item:last-child { border-bottom: none; }
        .suggestion-item:hover { background-color: #F1F5F9; }
        .suggestion-title { font-weight: 600; font-size: 15px; }
        .suggestion-author { font-size: 13px; color: var(--text-light); margin-top: 4px; }

        /* GENRE FILTERS */
        .genre-section { max-width: 1200px; margin: 30px auto 10px; padding: 0 20px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .genre-btn {
            background: white; border: 1px solid var(--border); padding: 8px 16px; border-radius: 50px; cursor: pointer;
            font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition);
        }
        .genre-btn:hover { border-color: var(--primary); color: var(--primary); }
        .genre-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* BOOK GRID */
        .container { max-width: 1200px; margin: 20px auto 60px; padding: 0 20px; }
        .section-title { margin-bottom: 25px; font-size: 20px; color: var(--text-light); font-weight: 500;}
        
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; }
        .book-card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.02);
            border: 1px solid var(--border); transition: var(--transition); display: flex; flex-direction: column;
        }
        .book-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.08); border-color: #CBD5E1; }
        
        .book-cover { height: 220px; background: linear-gradient(135deg, #F1F5F9 0%, #E2E8F0 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; color: var(--text-light); font-size: 50px; position: relative;}
        .book-pdf-badge { position: absolute; top: 15px; right: 15px; background: #EF4444; color: white; font-size: 11px; padding: 4px 8px; border-radius: 6px; font-weight: 700; letter-spacing: 1px; }
        .book-info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .book-category { font-size: 12px; color: var(--primary); font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;}
        .book-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; color: var(--text-dark); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .book-author { font-size: 13px; color: var(--text-light); margin-bottom: 20px; }
        .book-actions { margin-top: auto; display: grid; grid-template-columns: 1fr; gap: 10px; }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-light); grid-column: 1 / -1; }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo"><i class="fa-solid fa-layer-group"></i> Kutubxona.uz</a>
        <button class="btn btn-outline" onclick="alert('Yangi kitob qo\'shish paneli ulangan yo\'q. Hozir faqat qidiruv va PDF tizimini sinayapmiz.')">
            <i class="fa-solid fa-plus"></i> Kitob Qo'shish
        </button>
    </nav>

    <header class="header-section">
        <h1>Katta Elektron Kutubxona</h1>
        <p style="margin-bottom: 30px; font-size: 18px; color: #94A3B8;">1000 ta kitob ichidan o'zingizga keraklisini toping va PDF shaklida o'qing.</p>
        
        <div class="search-container">
            <div class="search-bar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Kitob nomi yoki yozuvchini qidiring..." onkeyup="handleSearch(event)" onfocus="showSuggestions()" onblur="hideSuggestionsDelay()">
            </div>
            <div class="suggestions" id="suggestionsBox"></div>
        </div>
    </header>

    <div class="genre-section" id="genreFilters">
        <button class="genre-btn active" onclick="filterByGenre('Barchasi', this)">Barchasi</button>
        <button class="genre-btn" onclick="filterByGenre('Badiiy Adabiyot', this)">Badiiy Adabiyot</button>
        <button class="genre-btn" onclick="filterByGenre('Tarixiy', this)">Tarixiy</button>
        <button class="genre-btn" onclick="filterByGenre('Dasturlash', this)">Dasturlash</button>
        <button class="genre-btn" onclick="filterByGenre('Biznes', this)">Biznes</button>
        <button class="genre-btn" onclick="filterByGenre('Psixologiya', this)">Psixologiya</button>
        <button class="genre-btn" onclick="filterByGenre('Detektiv', this)">Detektiv</button>
    </div>

    <div class="container">
        <div class="section-title">
            Topilgan kitoblar: <strong id="bookCount" style="color: var(--text-dark);">0</strong> ta
        </div>
        <div class="book-grid" id="bookGrid">
            </div>
    </div>

    <script>
        // PDF uchun namuna havola (W3C ning ochiq test PDF fayli)
        const samplePdfUrl = "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf";

        // 1. Dastlabki 15 ta haqiqiy kitoblar bazasi
        let books = [
            { id: 1, title: "O'tkan Kunlar", author: "Abdulla Qodiriy", category: "Badiiy Adabiyot", pdfUrl: samplePdfUrl },
            { id: 2, title: "Atom Odatlar", author: "Jeyms Klir", category: "Psixologiya", pdfUrl: samplePdfUrl },
            { id: 3, title: "Clean Code", author: "Robert C. Martin", category: "Dasturlash", pdfUrl: samplePdfUrl },
            { id: 4, title: "Temur Tuzuklari", author: "Amir Temur", category: "Tarixiy", pdfUrl: samplePdfUrl },
            { id: 5, title: "Boy Ota, Kambag'al Ota", author: "Robert Kiyosaki", category: "Biznes", pdfUrl: samplePdfUrl },
            { id: 6, title: "1984", author: "Jorj Oruell", category: "Badiiy Adabiyot", pdfUrl: samplePdfUrl },
            { id: 7, title: "Sherlok Xolms Sarguzashtlari", author: "Artur Konan Doyl", category: "Detektiv", pdfUrl: samplePdfUrl },
            { id: 8, title: "Alkimyogar", author: "Paulo Koelyo", category: "Badiiy Adabiyot", pdfUrl: samplePdfUrl },
            { id: 9, title: "JavaScript The Good Parts", author: "Douglas Crockford", category: "Dasturlash", pdfUrl: samplePdfUrl },
            { id: 10, title: "Boburnoma", author: "Zahiriddin Muhammad Bobur", category: "Tarixiy", pdfUrl: samplePdfUrl },
            { id: 11, title: "O'ylang va Boy bo'ling", author: "Napoleon Xill", category: "Biznes", pdfUrl: samplePdfUrl },
            { id: 12, title: "G'urur va Andisha", author: "Jeyn Ostin", category: "Badiiy Adabiyot", pdfUrl: samplePdfUrl },
            { id: 13, title: "Jinoyat va Jazo", author: "Fyodor Dostoevskiy", category: "Badiiy Adabiyot", pdfUrl: samplePdfUrl },
            { id: 14, title: "Qora Beva", author: "Agata Kristi", category: "Detektiv", pdfUrl: samplePdfUrl },
            { id: 15, title: "Algoritmlar", author: "Tomas Kormen", category: "Dasturlash", pdfUrl: samplePdfUrl }
        ];

        // 2. Qolgan 985 ta kitobni avtomatik generatsiya qilish (1000 ta bo'lishi uchun)
        const categories = ['Badiiy Adabiyot', 'Tarixiy', 'Dasturlash', 'Biznes', 'Psixologiya', 'Detektiv'];
        const authors = ['Ahmad Lutfiy', 'Tohir Malik', 'Stiven King', 'Den Braun', 'Oybek', 'G\'afur G\'ulom'];

        for(let i = 16; i <= 1000; i++) {
            let randomCategory = categories[Math.floor(Math.random() * categories.length)];
            let randomAuthor = authors[Math.floor(Math.random() * authors.length)];
            books.push({
                id: i,
                title: `Jahon Adabiyoti To'plami #${i}`,
                author: randomAuthor,
                category: randomCategory,
                pdfUrl: samplePdfUrl
            });
        }

        let currentGenre = 'Barchasi';

        // DOM Elementlari
        const bookGrid = document.getElementById('bookGrid');
        const bookCount = document.getElementById('bookCount');
        const searchInput = document.getElementById('searchInput');
        const suggestionsBox = document.getElementById('suggestionsBox');

        // Kutubxonani ekranga chiqarish funksiyasi
        function renderBooks(booksToRender) {
            bookGrid.innerHTML = '';
            bookCount.innerText = booksToRender.length;

            if(booksToRender.length === 0) {
                bookGrid.innerHTML = `<div class="empty-state">
                    <i class="fa-solid fa-box-open" style="font-size: 50px; margin-bottom: 20px; color: var(--border);"></i>
                    <h3>Bunday kitob topilmadi</h3>
                    <p>So'rovni o'zgartirib yoki boshqa janrni tanlab ko'ring.</p>
                </div>`;
                return;
            }

            // Tezlik uchun barcha HTML ni bitta stringda yig'ib keyin joylaymiz
            let htmlContent = '';
            booksToRender.forEach(book => {
                htmlContent += `
                    <div class="book-card">
                        <div class="book-cover">
                            <span class="book-pdf-badge">PDF</span>
                            <i class="fa-solid fa-file-pdf" style="font-size: 60px; color: #CBD5E1;"></i>
                        </div>
                        <div class="book-info">
                            <span class="book-category">${book.category}</span>
                            <h4 class="book-title" title="${book.title}">${book.title}</h4>
                            <p class="book-author">${book.author}</p>
                            <div class="book-actions">
                                <a href="${book.pdfUrl}" target="_blank" class="btn" style="justify-content: center;">
                                    <i class="fa-solid fa-book-open"></i> O'qish (PDF)
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            });
            bookGrid.innerHTML = htmlContent;
        }

        // JANRLAR BO'YICHA FILTRLASH
        function filterByGenre(genre, btnElement) {
            currentGenre = genre;
            
            // Tugmalar rangini o'zgartirish
            document.querySelectorAll('.genre-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // Qidiruv inputini tozalash (janr tanlaganda toza qidiruv bo'lishi uchun)
            searchInput.value = '';
            suggestionsBox.classList.remove('active');

            let filteredBooks = genre === 'Barchasi' ? books : books.filter(book => book.category === genre);
            renderBooks(filteredBooks);
        }

        // QIDIRUV VA AVTO-TAKLIFLAR (Autocomplete)
        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            
            // Takliflar qutisini yangilash
            if(query.length > 0) {
                suggestionsBox.classList.add('active');
                
                // Kitob nomi Yoki Muallif bo'yicha qidirish
                const matchedBooks = books.filter(book => 
                    book.title.toLowerCase().includes(query) || 
                    book.author.toLowerCase().includes(query)
                ).slice(0, 8); // Takliflar qutisida faqat 8 tasini ko'rsatamiz

                if(matchedBooks.length > 0) {
                    suggestionsBox.innerHTML = matchedBooks.map(book => `
                        <div class="suggestion-item" onclick="selectSuggestion('${book.title}')">
                            <span class="suggestion-title">${book.title}</span>
                            <span class="suggestion-author"><i class="fa-solid fa-pen-nib"></i> ${book.author} | ${book.category}</span>
                        </div>
                    `).join('');
                } else {
                    suggestionsBox.innerHTML = `<div class="suggestion-item" style="color: #EF4444;">Hech narsa topilmadi...</div>`;
                }
            } else {
                suggestionsBox.classList.remove('active');
            }

            // Asosiy Grid ni yangilash
            filterMainGrid(query);
        }

        // Asosiy ekrandagi kitoblarni qidiruv va joriy janrga qarab saralash
        function filterMainGrid(query) {
            let result = books;
            
            // 1. Agar biron janr tanlangan bo'lsa (Barchasi emas)
            if (currentGenre !== 'Barchasi') {
                result = result.filter(book => book.category === currentGenre);
            }
            
            // 2. Qidiruv so'zi bo'yicha
            if (query) {
                result = result.filter(book => 
                    book.title.toLowerCase().includes(query) || 
                    book.author.toLowerCase().includes(query)
                );
            }

            renderBooks(result);
        }

        // Taklif qilingan kitobni bosganda
        function selectSuggestion(title) {
            searchInput.value = title;
            suggestionsBox.classList.remove('active');
            filterMainGrid(title.toLowerCase());
        }

        function showSuggestions() {
            if(searchInput.value.trim().length > 0) {
                suggestionsBox.classList.add('active');
            }
        }

        // Inputdan fokus ketganda takliflar qutisini yopish (Kichik kechikish bilan, klik ishlashi uchun)
        function hideSuggestionsDelay() {
            setTimeout(() => {
                suggestionsBox.classList.remove('active');
            }, 200);
        }

        // Dastur ishga tushganda 1000 ta kitobni chiqarish
        window.onload = () => {
            renderBooks(books);
            console.log("Bazaga yuklangan kitoblar soni: " + books.length);
        };
    </script>
</body>
</html>
